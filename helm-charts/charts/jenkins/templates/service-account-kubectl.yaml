{{- if .Values.rbac.create -}}
---
# ServiceAccount for kubectl pod template
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins-kubectl
  namespace: {{ template "jenkins.agent.namespace" . }}
  labels:
    {{- include "jenkins.labels" . | nindent 4 }}
automountServiceAccountToken: true

---
# Role for kubectl pod template with read permissions
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jenkins-kubectl
  namespace: {{ template "jenkins.agent.namespace" . }}
  labels:
    {{- include "jenkins.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log", "services", "endpoints", "persistentvolumeclaims", "events", "configmaps", "secrets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "daemonsets", "replicasets", "statefulsets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["batch"]
  resources: ["jobs", "cronjobs"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list"]

---
# RoleBinding for kubectl pod template
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-kubectl
  namespace: {{ template "jenkins.agent.namespace" . }}
  labels:
    {{- include "jenkins.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: jenkins-kubectl
subjects:
- kind: ServiceAccount
  name: jenkins-kubectl
  namespace: {{ template "jenkins.agent.namespace" . }}

---
# ClusterRole for kubectl pod template to read nodes
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "jenkins.fullname" . }}-kubectl-nodes
  labels:
    {{- include "jenkins.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list"]

---
# ClusterRoleBinding for kubectl pod template
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "jenkins.fullname" . }}-kubectl-nodes
  labels:
    {{- include "jenkins.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "jenkins.fullname" . }}-kubectl-nodes
subjects:
- kind: ServiceAccount
  name: jenkins-kubectl
  namespace: {{ template "jenkins.agent.namespace" . }}

{{- end }}
